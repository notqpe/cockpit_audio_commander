name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Проверка синтаксиса
        run: python -m py_compile cockpit_commander.py

      - name: Статический анализ
        run: |
          pip install pyflakes
          python -m pyflakes cockpit_commander.py
